<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据导入 - 宝宝记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1e40af;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1e293b;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            min-height: 200px;
            resize: vertical;
        }
        .btn {
            background: #1e40af;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
            width: 100%;
        }
        .btn:hover {
            background: #1e3c8a;
        }
        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }
        .status.loading {
            background: #e0f2fe;
            color: #0369a1;
            display: block;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .instructions {
            background: #f0fdf4;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .file-input-wrapper {
            margin-bottom: 20px;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 数据导入</h1>

        <div class="instructions">
            <p>将导出的 JSON 数据粘贴到下方文本框中，然后点击"导入"按钮。</p>
        </div>

        <div class="form-group">
            <label for="jsonData">JSON 数据：</label>
            <textarea id="jsonData" placeholder='{"users": [...], "categories": [...], "transactions": [...]}'></textarea>
        </div>

        <button class="btn" onclick="importData()">导入数据</button>

        <div id="status" class="status"></div>
    </div>

    <script>
        async function importData() {
            const jsonText = document.getElementById('jsonData').value.trim();
            const statusEl = document.getElementById('status');
            const btn = document.querySelector('.btn');

            if (!jsonText) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 请输入 JSON 数据';
                return;
            }

            try {
                const data = JSON.parse(jsonText);

                if (!data.users || !data.categories || !data.transactions) {
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ JSON 格式不正确，必须包含 users, categories, transactions';
                    return;
                }

                btn.disabled = true;
                statusEl.className = 'status loading';
                statusEl.textContent = '⏳ 正在导入数据...';

                const response = await fetch('/api/import-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || '导入失败');
                }

                statusEl.className = 'status success';
                statusEl.innerHTML = `✅ 导入成功！<br>
                    • Users: ${result.imported.users}<br>
                    • Categories: ${result.imported.categories}<br>
                    • Transactions: ${result.imported.transactions}`;

                document.getElementById('jsonData').value = '';

                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = `❌ 错误: ${error.message}`;
                btn.disabled = false;
            }
        }

        // 回车提交
        document.getElementById('jsonData').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                importData();
            }
        });
    </script>
</body>
</html>
